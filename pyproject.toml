[build-system]
requires = ["setuptools>=77.0.3", "build-meta-plus"]
build-backend = "build_meta_plus"

[project]
name = "gwctl"
version = "0.1.0"
description = "GNOME Wayland Window Control - Command-line interface for managing GNOME Wayland windows"
authors = [{ name = "Ronny Rentner", email = "gwctl.code@ronny-rentner.de" }]
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE.txt"]
requires-python = ">=3.10"
keywords = ["gnome", "window-manager", "dbus", "cli", "linux"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Topic :: Desktop Environment",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "ultraclick @ git+https://github.com/ronny-rentner/ultraclick.git",
  "dbus-python >= 1.4.0"
]

[project.optional-dependencies]
dev = ["check-manifest"]
test = ["coverage"]

[project.urls]
Homepage = "https://github.com/ronny-rentner/gwctl"
Repository = "https://github.com/ronny-rentner/gwctl.git"
Issues = "https://github.com/ronny-rentner/gwctl/issues"

[project.scripts]
gwctl = "gwctl:main"

[tool.build_meta_plus]
post-build = [
  "rm -rf build/",
  "rm -rf src/*.egg-info/"
]
